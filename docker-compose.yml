services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accelerator
      POSTGRES_PASSWORD: accelerator
      POSTGRES_DB: accelerator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accelerator -d accelerator"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5434:5432"

  server:
    build:
      context: ./server
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://accelerator:accelerator@postgres:5432/accelerator}
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-development}
      COUNCIL_BASE_URL: ${COUNCIL_BASE_URL:-}
      COUNCIL_API_KEY: ${COUNCIL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4000:4000"

  client:
    build: ./client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:

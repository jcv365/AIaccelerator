server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind the shared WAF every request arrives from the WAF container, so without this all visitors would
  # look like one address and share one login-lockout bucket. The WAF puts the visitor's address in
  # X-Real-IP; trust that header only when it comes from the gateway network (docker network inspect
  # placements_gateway). If that network is ever recreated with another subnet, update this line.
  set_real_ip_from 172.25.0.0/16;
  real_ip_header X-Real-IP;

  location /api/ {
    proxy_pass http://server:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 95s;
  }

  location /auth/ {
    proxy_pass http://server:4000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 95s;
  }

  # Vite emits content-hashed files under /assets/, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # index.html names the current hashed assets, so it must always be revalidated or a deploy looks stale.
  location / {
    add_header Cache-Control "no-cache";
    # Browsers honour HSTS only on https responses, i.e. when served through the WAF's TLS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri /index.html;
  }
}

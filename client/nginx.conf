server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 95s;
  }

  location /auth/ {
    proxy_pass http://server:4000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 95s;
  }

  # Vite emits content-hashed files under /assets/, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html names the current hashed assets, so it must always be revalidated or a deploy looks stale.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
